
spring.application.name=trackmyfinance

# Load secrets from the gitignored .env (works from repo root or from /backend)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60
app.registration-enabled=${APP_REGISTRATION_ENABLED:false}
server.error.include-message=always
server.error.include-binding-errors=always

app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.gemini.base-url=https://generativelanguage.googleapis.com
app.gemini.timeout-seconds=30
app.gemini.temperature=0.3
app.gemini.max-output-tokens=4096

app.ai.currency=INR
app.ai.min-expenses=10
app.ai.cooldown-seconds=120
app.ai.max-requests-per-minute=4
app.ai.max-requests-per-day=100
app.ai.max-retries=2
app.ai.retry-base-millis=1000
app.ai.max-retry-wait-seconds=10
app.ai.total-budget-seconds=60