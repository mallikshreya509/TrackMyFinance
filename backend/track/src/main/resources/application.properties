
spring.application.name=trackmyfinance

# Load secrets from the gitignored .env (works from repo root or from /backend)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:../../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true